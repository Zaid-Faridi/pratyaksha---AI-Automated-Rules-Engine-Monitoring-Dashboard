description: Master mapping of vocational skilling centres, cameras, trade profiles,
  zones, and demo violation scenarios.
centres:
  centre_mh_01:
    centre_id: centre_mh_01
    name: Pune Skill Development Institute
    state: Maharashtra
    district: Pune
    trade_id: it_lab
    trade_name: IT / Computer Lab
    scheme: PMKVY 4.0
    claimed_attendance: 15
    active_batch: Python & Web Development Level 4
    cameras:
    - camera_id: cam_01
      name: Classroom & Workstation View
      video_file: demo_footage/centre_mh_01/cam_01.mp4
      zones:
        classroom:
          type: workstation
          polygon:
          - - 40
            - 40
          - - 620
            - 40
          - - 620
            - 680
          - - 40
            - 680
          expected_infrastructure:
            computer: 15
            chair: 15
        instructor_podium:
          type: instructor
          polygon:
          - - 660
            - 40
          - - 1240
            - 40
          - - 1240
            - 280
          - - 660
            - 280
          expected_infrastructure:
            workbench: 1
            chair: 1
        safety_entrance:
          type: entrance
          polygon:
          - - 660
            - 300
          - - 1240
            - 300
          - - 1240
            - 680
          - - 660
            - 680
          expected_infrastructure:
            fire_extinguisher: 1
            first_aid_box: 1
            biometric_device: 1
      sanctioned_inventory:
        computer: 15
        chair: 15
        fire_extinguisher: 1
        first_aid_box: 1
        biometric_device: 1
      default_scenario: compliant
      scenarios:
        compliant:
          label: Compliant Session
          description: Normal batch operation, 15 present, verified IT terminals and
            instructor present.
        inflated_attendance:
          label: Inflated Attendance Claim
          description: Portal claims 25 trainees; video detects only 8 present (attendance
            mismatch alert).
          claimed_attendance: 25
        missing_machine:
          label: Missing Equipment Deficit
          description: Multiple student desktop workstations missing from lab bench.
          hide_equipment:
          - computer
        instructor_absent:
          label: Instructor Absent
          description: Demonstration podium unoccupied during mandatory teaching window.
          force_instructor_absent: true
        poor_quality:
          label: Poor Quality / Occlusion
          description: Simulated camera lens dust, severe blur or occlusion triggering
            quality gate.
          simulate_blur: true
        idle_session:
          label: Zone Idle / Inactive
          description: Students physically seated but prolonged inactivity with zero
            PC interactions.
          force_idle: true
