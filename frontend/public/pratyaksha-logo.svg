<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="50%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Hexagonal Shield -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.35" />

  <!-- Subdued Radar / Spatial Concentric Grid -->
  <circle cx="60" cy="60" r="42" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.18" stroke-dasharray="3 3" />
  <circle cx="60" cy="60" r="30" stroke="#2DD4BF" stroke-width="1" stroke-opacity="0.25" />

  <!-- Camera Viewfinder Corner Brackets -->
  <path d="M 24 34 L 24 24 L 34 24" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 96 34 L 96 24 L 86 24" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 24 86 L 24 96 L 34 96" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 96 86 L 96 96 L 86 96" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Pratyaksha Optical Eye Contour (Direct Perception) -->
  <path d="M 26 60 C 37 42, 83 42, 94 60 C 83 78, 37 78, 26 60 Z" 
        fill="#031726" 
        fill-opacity="0.5" 
        stroke="url(#lensGrad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Inner Iris Ring with Tech Notches -->
  <circle cx="60" cy="60" r="17" stroke="#38BDF8" stroke-width="2" fill="#0A2540" fill-opacity="0.9" />
  <circle cx="60" cy="60" r="11" fill="url(#lensGrad)" />

  <!-- Central Pupil / AI Core Pulse -->
  <circle cx="60" cy="60" r="5" fill="#FFFFFF" filter="url(#glow)" />

  <!-- Crosshair Reticle Center Lines -->
  <line x1="60" y1="36" x2="60" y2="40" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <line x1="60" y1="80" x2="60" y2="84" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <line x1="36" y1="60" x2="40" y2="60" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <line x1="80" y1="60" x2="84" y2="60" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />

  <!-- Small Optical Reflex Highlight -->
  <circle cx="56.5" cy="56.5" r="2" fill="#FFFFFF" fill-opacity="0.9" />
</svg>
